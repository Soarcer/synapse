name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build core (required before tests)
        run: pnpm --filter @synapse-ai/core build

      - name: Test
        run: pnpm test

      - name: Build remaining packages (ordered)
        run: |
          pnpm --filter @synapse-ai/server build
          pnpm --filter @synapse-ai/cli build

      - name: Install Playwright browsers
        run: pnpm --filter @synapse-ai/dashboard exec playwright install --with-deps chromium
        if: matrix.os == 'ubuntu-latest'

      - name: Run Playwright E2E
        run: pnpm --filter @synapse-ai/dashboard exec playwright test
        if: matrix.os == 'ubuntu-latest'

      - name: Audit (non-blocking)
        run: pnpm audit --audit-level=high
        continue-on-error: true
